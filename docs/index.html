<html lang="zh-CN">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: Chinese-In-Flow structure (plain site header + nav, one big rounded game frame, text sections below) dressed in the book's teal/coral palette. Single light theme, matching the printed book. */
:root{
  --page:#F4F9FA; --panel:#D2E6EB; --sheet:#FFFFFF; --tip:#BCE2EE; --chip:#E7F2F4;
  --teal:#368C89; --teal-d:#2C7471; --deep:#1F4E5A; --sub:#86BDBF; --ink:#22323A; --muted:#4E6A73; --line:#D5E5EA;
  --coral:#F0866A; --coral-d:#D9694D; --buy:#B8472A; --buy-d:#9C3A20; --ok:#2E9A6B; --ok-soft:#DDF2E7; --bad:#E0674B; --bad-soft:#FBE3DC;
  --opt:#D7EEF2; --opt-b:#A9D5DD;
  --f:"Inter","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --fd:"Rubik","Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:8px 40px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal-d)}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
[hidden]{display:none!important}

/* site header (CIF-like) */
.site-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-block:18px 10px}
.brand{text-decoration:none;color:inherit;display:block;border-bottom:1px solid var(--line);padding-bottom:8px;padding-right:18px}
.brand b{display:block;font-family:var(--fd);font-weight:800;font-size:26px;color:var(--deep);letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:13.5px;color:var(--muted)}
nav.main{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
nav.main a{text-decoration:none;color:#4A5D64;font-size:14.5px;padding:6px 9px;border-radius:8px}
nav.main a:hover{background:var(--chip)}
nav.main a[aria-current="page"]{color:var(--teal-d);font-weight:600;background:var(--chip)}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sheet);margin-left:6px}
.langs button{white-space:nowrap;border:0;background:none;padding:3px 10px;min-height:32px;min-width:38px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--teal);color:#fff}

/* ===== game frame ===== */
.frame{position:relative;margin-top:14px;border-radius:34px;border:3px solid #fff;box-shadow:0 0 0 1.5px #B9CDD2,0 16px 40px -24px rgba(20,60,70,.6);overflow:hidden;
  background:linear-gradient(180deg,#2D5C70 0%,#4F8C98 42%,#8CC5C8 74%,#CDEBE5 100%);aspect-ratio:16/11;min-height:520px;max-height:80vh;width:100%;color:#fff;user-select:none;-webkit-user-select:none}
.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:28%;pointer-events:none}
.fl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:22px 22px 84px}
.fl.center{justify-content:center}
.title{font-family:var(--fd);font-weight:900;text-align:center;line-height:.95;color:#2A3B40;margin:0;
  -webkit-text-stroke:0;text-shadow:0 0 0 #fff,3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 4px 0 #fff,0 -4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 10px 18px rgba(0,0,0,.25)}
.title .a{display:block;font-size:clamp(46px,9vw,92px);letter-spacing:.01em}
.title .b{display:block;font-size:clamp(24px,4.2vw,40px);margin-top:8px}
.title .c{display:block;font-family:var(--f);font-weight:700;font-size:15px;color:#E8F6F5;text-shadow:none;margin-top:12px;letter-spacing:.3em}
.menu{display:grid;gap:12px;margin-top:22px;width:min(250px,80%)}
.mbtn{border:0;background:#1F2F35;color:#fff;font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:18px 10px;border-radius:22px;box-shadow:0 4px 0 #0E1A1E;transition:transform .1s}
.mbtn:hover{background:#2A3F46}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0E1A1E}
.mbtn small{display:block;font-family:var(--f);font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:#A9CBCF;margin-top:2px}
.corner{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;z-index:3}
.cbtn{width:46px;height:46px;border-radius:14px;border:2.5px solid #fff;background:var(--teal-d);color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.cbtn.back{background:#2F6B4F}
.cbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.snd{position:absolute;right:16px;top:14px;display:flex;gap:8px;z-index:3}
.sbtn{width:42px;height:42px;border-radius:50%;border:2.5px solid #fff;background:#F4F7F7;color:#2A3B40;display:grid;place-items:center;padding:0}
.sbtn.on2{background:var(--teal-d);color:#fff}
.sbtn.off{opacity:.55}
.sbtn svg{width:21px;height:21px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.sbtn svg path+path{fill:none}

/* select screen */
.sel-h{font-family:var(--fd);font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);margin:4px 0 10px;text-align:center}
.ltabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.ltab{border:2px solid #fff;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px}
.ltab[aria-pressed="true"]{background:#fff;color:var(--deep)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;width:100%;max-width:820px;overflow:auto;padding:4px;max-height:100%;align-content:start}
.set{border:0;background:rgba(255,255,255,.92);color:var(--ink);border-radius:16px;padding:10px 10px 9px;text-align:left;display:grid;gap:1px;min-width:0;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.set:hover{background:#fff}
.set b{font-size:14.5px;line-height:1.2;color:var(--teal-d);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em}
.set span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set i{display:block;height:4px;border-radius:4px;background:var(--chip);margin-top:5px;overflow:hidden;font-style:normal}
.set i::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--teal)}
.set .best{font-size:11.5px;color:var(--buy);font-weight:600}
.scroll-fade{flex:1;min-height:0;width:100%;display:flex;justify-content:center}

/* play screen */
.target{background:#F8FAFA;color:#2A3B40;border:3px solid #4C5A5E;border-radius:26px;min-width:min(330px,82%);max-width:92%;min-height:110px;padding:14px 26px;display:grid;place-items:center;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.18);margin-top:34px;position:relative}
.target .main{font-size:clamp(28px,5vw,48px);font-weight:600;line-height:1.15}
.target .main.zh{font-size:clamp(24px,4.2vw,40px)}
.target .main.long{font-size:clamp(18px,2.8vw,26px)}
.target .hintline{font-size:14px;color:var(--muted);margin-top:4px}
.target button.play{border:0;background:var(--chip);color:var(--teal-d);border-radius:999px;width:64px;height:64px;display:grid;place-items:center}
.target button.play svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.target .new{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--buy);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;letter-spacing:.05em}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px;width:100%;max-width:840px}
.opt{flex:0 1 calc(33.333% - 12px);min-width:150px;min-height:86px;border:2.5px solid var(--opt-b);background:var(--opt);color:#2C4950;border-radius:22px;padding:10px 12px;display:grid;place-items:center;text-align:center;line-height:1.25;transition:opacity .2s, transform .12s, background .15s}
.opt:hover{background:#E6F5F7}
.opt .o1{font-size:20px;font-weight:700}
.opt .o1.zh{font-size:19px;font-weight:600}
.opt .o1.long{font-size:15px}
.opt .o2{font-size:13.5px;color:#5E8189;margin-top:2px}
.opt.ok{background:#DFF5E9;border-color:var(--ok);color:#1E6B49}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .3s}
.opt{position:relative}
.opt.fade{opacity:.28;pointer-events:none}
.opt.ok::after,.opt.show::after,.opt.bad::after,.opt.was::after{position:absolute;top:-11px;right:-9px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:800;color:#fff;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.opt.ok::after,.opt.show::after{content:"✓";background:var(--ok)}
.opt.bad::after,.opt.was::after{content:"✕";background:var(--bad)}
.opt.was{background:var(--bad-soft);border-color:var(--bad);border-style:dashed;opacity:.7}
.opt.show{background:#DFF5E9;border-width:3.5px}
.reveal{margin-top:10px;background:rgba(15,40,48,.72);color:#fff;border-radius:999px;padding:6px 16px;font-size:15px;font-weight:600;text-align:center;max-width:92%}
.reveal b{color:#B9F0D2;margin-right:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.opt.show{border-color:var(--ok);box-shadow:0 0 0 5px rgba(46,154,107,.45)}
.timer{position:absolute;left:132px;right:22px;bottom:20px;height:40px;border-radius:999px;background:#D9DDDE;border:2.5px solid #fff;overflow:hidden;z-index:2}
.timer i{display:block;height:100%;width:100%;background:var(--deep);border-radius:999px;transition:width .2s linear}
.timer i.low{background:var(--coral-d)}
.timer.off{display:none}
.hud{position:absolute;left:22px;top:18px;display:flex;gap:14px;font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);z-index:2;font-variant-numeric:tabular-nums}
.hud span{background:rgba(0,0,0,.18);border-radius:999px;padding:3px 11px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.opt,.target{animation:rise .22s ease-out}
@media (prefers-reduced-motion:reduce){.opt,.target,.opt.bad{animation:none}.timer i{transition:none}}

/* settings & result panels */
.panel{background:rgba(255,255,255,.96);color:var(--ink);border-radius:24px;padding:20px 22px;width:min(520px,94%);box-shadow:0 10px 30px -10px rgba(0,0,0,.35);max-height:100%;overflow:auto}
.panel h3{margin:0 0 12px;font-family:var(--fd);font-size:22px;color:var(--deep)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.row:first-of-type{border-top:0}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--teal);background:var(--chip);color:var(--teal-d);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.kpi{background:var(--chip);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px;color:var(--teal-d);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.miss{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px;max-height:170px;overflow:auto}
.miss li{display:flex;gap:8px;align-items:center;background:#F3F8F9;border-radius:10px;padding:5px 10px;font-size:14px}
.miss .w{font-weight:600;flex:1;min-width:0}
.miss .t{color:var(--muted);flex:1;min-width:0;text-align:right}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:0;background:var(--teal-d);color:#fff;font-weight:600;font-size:15px;padding:10px 20px;border-radius:999px}
.btn.teal{background:var(--teal-d)}
.btn.buy{background:var(--buy)}
.btn.buy:hover{background:var(--buy-d)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--teal-d);border:1.5px solid var(--teal)}
.say{border:0;background:var(--chip);color:var(--teal);border-radius:999px;width:28px;height:28px;display:inline-grid;place-items:center;flex:none;padding:0;vertical-align:middle}
.say svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.say.playing{background:var(--teal-d);color:#fff}

/* ===== text pages ===== */
.prose{max-width:760px;margin:30px auto 0}
.prose h2{font-family:var(--fd);font-weight:800;font-size:26px;color:var(--deep);margin:30px 0 8px}
.prose h2:first-child{margin-top:0}
.prose p{margin:8px 0;color:#34474F}
.prose ul{margin:8px 0;padding-left:20px;color:#34474F}
.prose li{margin:4px 0}
.prose .big{font-size:17px}
.page-h{margin:26px 0 6px;font-family:var(--fd);font-weight:800;font-size:32px;color:var(--deep);line-height:1.15}
.page-sub{color:var(--muted);margin:0 0 14px;max-width:70ch}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.toolbar input{font:inherit;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;min-width:0;flex:1 1 220px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--chip);color:var(--teal-d);font-weight:600}
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:var(--r);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#F7FBFC;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid #EDF3F5;vertical-align:middle}
td.ru{font-weight:600;font-size:16px;white-space:nowrap}
td.src{color:var(--muted);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.grp th{background:var(--chip);color:var(--teal-d);font-size:14px;letter-spacing:0;text-transform:none;padding:10px 12px;position:static}
tr.grp .chip{margin-left:8px;padding:2px 10px;font-size:12px}
.count{color:var(--muted);font-size:13px}

/* lessons */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lcard{text-align:left;border:0;background:#fff;border-radius:var(--r);padding:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transition:transform .15s, box-shadow .15s;min-width:0;box-shadow:0 1px 0 var(--line)}
.lcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px -12px rgba(30,80,90,.45)}
.lcard img{width:100%;aspect-ratio:7/3.8;object-fit:cover;object-position:top left;display:block;background:var(--teal)}
.lcard .meta{padding:10px 13px 12px;display:grid;gap:1px}
.lcard .n{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.lcard .t{font-weight:700;color:var(--teal-d);font-size:16.5px}
.lcard .z{color:var(--muted);font-size:13px}
.prem-block{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--deep);color:#fff;border-radius:var(--r);padding:18px 22px;margin:26px 0 14px}
.prem-block h2{margin:0;font-family:var(--fd);font-size:22px}
.prem-block p{margin:2px 0 0;color:#CFE6E8;font-size:14px}
.grid.locked-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid.locked-grid .lcard .z,.grid.locked-grid .lcard .pbar{display:none}
.grid.locked-grid .lcard .t{font-size:14.5px}
.pbar{height:4px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--teal)}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.spread{display:grid;grid-template-columns:minmax(0,37fr) minmax(0,63fr);gap:18px;align-items:start;background:#E2EFF3;padding:18px;border-radius:24px}
.col{display:grid;gap:18px;min-width:0}
.cover{border-radius:var(--r);overflow:hidden;background:var(--teal)}
.cover img{display:block;width:100%}
.wpanel{background:var(--panel);border-radius:var(--r);padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.wpanel .it{min-width:0}
.wpanel .w{font-size:18px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wpanel .e,.wpanel .ez{color:#7C98A1;font-size:13.5px}
.wpanel .say{background:rgba(255,255,255,.6)}
.sheet{background:#F8FBFB;border-radius:var(--r);padding:28px 30px 30px}
.sheet .pg{float:right;color:var(--muted);font-size:13px}
.sheet h1{margin:0 0 8px;font-size:clamp(19px,2.3vw,25px);line-height:1.35;font-weight:700}
.sheet .intro{color:#41555E;margin:0}
.words{display:grid;grid-template-columns:1fr 1fr;gap:24px 30px;margin-top:24px}
.word{min-width:0}
.word h3{margin:0;color:var(--teal);font-size:20px;line-height:1.25;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.word .s{color:var(--sub);font-weight:600;font-size:14.5px;margin-top:3px}
.word .d{margin:8px 0 0;color:#33454D;font-size:14.5px}
.ex{margin-top:8px;display:grid;gap:1px;font-size:14.5px}
.ex .r{display:flex;gap:6px;align-items:flex-start}
.ex b{font-weight:700;flex:none}
.word .x{margin-top:8px;font-size:13.5px;color:var(--teal-d);background:var(--chip);border-radius:10px;padding:6px 10px;display:inline-block}
.tip{background:var(--tip);border-radius:var(--r);padding:24px 26px;position:relative}
.tip h3{margin:0 0 10px;font-size:18px;line-height:1.4;padding-right:44px}
.tip .warn{position:absolute;right:20px;top:-18px;width:52px;height:46px}
.tip p{margin:6px 0;color:#2C4049;font-size:14.5px}
.tip .rw{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;margin:8px 0;font-size:14.5px}
.tip .k{background:#F8FBFB;border-radius:12px;padding:2px 10px;font-weight:600;font-size:14px;max-width:100%;overflow-wrap:anywhere}
.tip .rw>*{min-width:0}
.tip .arr{color:var(--teal);font-weight:700}
.tip .lab{color:var(--teal-d);font-weight:700}
.practice-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px;padding-top:16px;border-top:1px dashed var(--line)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.note-lang{font-size:13px;background:var(--chip);color:var(--teal-d);padding:8px 12px;border-radius:10px;margin-bottom:10px}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.alpha button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 0 10px;font-size:22px;font-weight:600;color:var(--teal-d)}
.alpha button small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.audio-state{font-size:12.5px;color:var(--muted)}
.tabbar{display:none}
.more{display:none}
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* premium / account */
.nav-prem{color:var(--buy)!important;font-weight:700}
.nav-acc{border:1.5px solid var(--line)}
.lockb{display:inline-flex;align-items:center;gap:4px;background:var(--buy);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;letter-spacing:.03em}
.lockb svg{width:11px;height:11px;fill:currentColor}
.lcard.locked img{filter:grayscale(.55) brightness(.92)}
.set.locked{background:rgba(255,255,255,.7)}
.set.locked b{color:#6C8389}
.ltab .lockb{margin-left:4px;padding:1px 6px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
.plan{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:8px;align-content:start;position:relative}
.plan.best{border-color:var(--coral)}
.plan .tag{position:absolute;top:-12px;left:20px;background:var(--buy);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.plan h3{margin:0;font-size:18px;color:var(--deep)}
.plan .price{font-family:var(--fd);font-size:34px;font-weight:800;color:var(--ink);line-height:1.1}
.plan .price small{font-family:var(--f);font-size:15px;color:var(--muted);font-weight:500}
.plan ul{margin:6px 0 10px;padding-left:18px;color:#34474F;font-size:14.5px}
.plan .btn{justify-self:stretch;width:100%}
.paybox{display:grid;gap:4px}
.paybox small{font-size:12px;color:var(--muted);text-align:center}
.btn.cn{background:#1AAD19}
.btn.cn+small{color:var(--muted)}
.plan.free{background:#F7FBFC}
.hero-prem{background:linear-gradient(135deg,#2D5C70,#368C89);color:#fff;border-radius:26px;padding:28px 28px 26px;margin-top:16px}
.hero-prem h1{margin:0;font-family:var(--fd);font-size:clamp(28px,4.5vw,40px)}
.hero-prem p{margin:8px 0 0;color:#DDF0EF;max-width:60ch}
.demo{background:#FFF4E5;border:1px solid #F3C98B;color:#7A4B0C;border-radius:12px;padding:9px 13px;font-size:13.5px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:16px}
.card h2{margin:0 0 10px;font-size:20px;color:var(--deep)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv b{color:var(--muted);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:var(--fd);font-size:28px;color:var(--teal-d);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.lvbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.lvbar i{display:block;height:10px;border-radius:10px;background:var(--chip);overflow:hidden}
.lvbar i::after{content:"";display:block;height:100%;width:var(--p);background:var(--teal)}
.modal-bg{position:fixed;inset:0;background:rgba(20,45,55,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:24px;padding:24px;width:min(420px,100%);box-shadow:0 20px 50px -20px rgba(0,0,0,.5);display:grid;gap:10px;max-height:92vh;overflow:auto}
.modal h3{margin:0;font-family:var(--fd);font-size:22px;color:var(--deep)}
.modal p{margin:0;color:var(--muted);font-size:14px}
.modal input{font:inherit;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);width:100%}
.modal input.code{letter-spacing:.4em;font-size:20px;text-align:center}
.modal .btn{width:100%}
.oauth{display:grid;gap:8px}
.obtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:600;font-size:14.5px;display:flex;gap:8px;justify-content:center;align-items:center}
.obtn:disabled{opacity:.5;cursor:not-allowed}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.x{justify-self:end;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.legal{max-width:760px;margin:24px auto 0}
.legal h1{font-family:var(--fd);font-size:30px;color:var(--deep);margin:0 0 6px;line-height:1.2}
.legal h2{font-size:18px;color:var(--deep);margin:26px 0 6px}
.legal p{margin:6px 0;color:#34474F}
.legal mark{background:#FFE7A8;color:inherit;border-radius:4px;padding:0 3px}
.legal .toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.agree{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:14px;color:#34474F;cursor:pointer}
.agree input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--teal)}
.agree.need{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.mini{font-size:12px;color:var(--muted);margin:0}
footer a{color:var(--muted)}
.paywall-page{text-align:center;max-width:560px;margin:40px auto 0}
.paywall-page .ic{width:64px;height:64px;border-radius:20px;background:var(--buy);display:grid;place-items:center;margin:0 auto 14px}
.paywall-page .ic svg{width:30px;height:30px;fill:#fff}
.plays{font-size:13.5px;font-weight:600;color:#fff;margin-top:12px;text-align:center;background:rgba(15,40,48,.66);border-radius:999px;padding:7px 16px;display:inline-flex;gap:10px;align-items:center}
.plays button{border:0;background:var(--buy);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:12.5px}
/* ===== carrera ===== */
.menu.m4{grid-template-columns:1fr 1fr;width:min(520px,92%)}
.frame.racing{aspect-ratio:auto;max-height:none;min-height:640px}
.frame.racing .fl.race{position:relative;min-height:640px}
.fl.race{padding:58px 18px 18px;gap:9px}
.track{position:relative;width:min(860px,100%);background:rgba(31,47,53,.55);border:2px solid rgba(255,255,255,.65);border-radius:18px;padding:4px 8px;flex-shrink:0}
.lane{position:relative;height:38px;border-bottom:2px dashed rgba(255,255,255,.3)}
.lane:last-of-type{border-bottom:0}
.lane.me{background:rgba(255,255,255,.12);border-radius:10px}
.lname{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;color:#E8F6F5;width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane.me .lname{color:#fff}
.carw{position:absolute;bottom:3px;left:calc(48px + var(--x,0) * (100% - 48px - 66px));width:62px;transition:left .12s linear}
.car{display:block;width:62px;height:27px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.finish{position:absolute;top:4px;bottom:4px;right:58px;width:8px;background:repeating-conic-gradient(#fff 0 25%,#1F2F35 0 50%) 0 0/8px 8px;border-radius:2px}
.rbox{background:rgba(255,255,255,.96);color:var(--ink);border-radius:20px;padding:10px 16px 12px;width:min(640px,100%);text-align:center;box-shadow:0 10px 30px -14px rgba(0,0,0,.4);flex-shrink:0}
.rword{font-family:var(--fd);font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:.03em;line-height:1.25;color:#A3B7BC;word-break:break-word}
.rword span{display:inline-block;border-radius:6px;padding:0 1px}
.rword .d{color:var(--teal-d)}
.rword .c{color:var(--ink);background:#FFE7A3;box-shadow:inset 0 -3px 0 #C9862B}
.rword .sp{color:#C5D3D6;font-weight:400}
.rword .c.sp{color:#8A6A1F}
.rword .err{animation:rshake .25s;background:#F6C7BA;box-shadow:inset 0 -3px 0 var(--buy)}
@keyframes rshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.rmean{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:15px;margin-top:2px;color:var(--muted)}
.rmean .ru{color:var(--ink);font-weight:600}
.rnext{font-size:12.5px;color:var(--muted);margin-top:4px}
.rhint{margin:0;font-size:12px;line-height:1.35;color:#F2FBFA;text-align:center;max-width:640px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.rkb{width:min(640px,100%);display:grid;gap:5px;flex-shrink:0}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1 1 0;max-width:48px;min-width:0;height:44px;border:0;border-radius:9px;background:rgba(255,255,255,.94);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.28);display:grid;place-items:center;position:relative;padding:0;font:inherit;touch-action:manipulation;cursor:pointer}
.k b{font-size:17px;font-weight:700;line-height:1}
.k i{position:absolute;right:4px;top:2px;font-size:9.5px;font-style:normal;color:#7E979D;line-height:1}
.k.nx{background:#FFE7A3;box-shadow:0 0 0 2px #C9862B,0 2px 0 rgba(0,0,0,.28)}
.k.hit{background:#BFE6DC}
.k.bad{background:#F6C7BA}
.k.space{flex:0 1 320px;max-width:320px;font-size:13px;color:var(--muted)}
.rcount{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:110px;font-weight:900;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.4);pointer-events:none;z-index:4}
.rcount[hidden]{display:none}
.rcount.go{font-size:64px;white-space:nowrap}
.rkb{background:rgba(31,47,53,.32);border-radius:16px;padding:7px}
@media (max-width:640px){
  .fl.race{padding:62px 8px 78px;gap:8px}
  .lane{height:34px}.carw{width:52px;left:calc(44px + var(--x,0) * (100% - 44px - 56px))}.car{width:52px;height:23px}.finish{right:50px}
  .k{height:46px;border-radius:7px}.k b{font-size:16px}.k i{display:none}.kr{gap:3px}
  .rhint{display:none}
  .fl.race .hud{right:100px}
  .fl.race{padding-top:90px}
  .rkb{padding:5px}
}
@media (max-width:860px){
  .spread{grid-template-columns:1fr;padding:12px}
  .words{grid-template-columns:1fr}
  .sheet{padding:22px 20px}
}
@media (max-width:640px){
  nav.main a{display:none}
  nav.main{margin-left:auto}
  .site-h{flex-wrap:nowrap;align-items:center;padding-block:12px 4px}
  .brand{border:0;padding:0}
  .brand b{font-size:21px}
  .brand span{font-size:12px}
  .langs button{min-height:40px;min-width:42px;font-size:13px}
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -14px rgba(20,60,70,.5)}
  .tabbar a,.tabbar button{border:0;background:none;text-decoration:none;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;min-height:56px;align-content:center;border-radius:12px;padding:0}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tabbar [aria-current="page"],.tabbar [aria-expanded="true"]{color:var(--teal-d);background:var(--chip)}
  .more{position:fixed;left:10px;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:49;background:#fff;border-radius:20px;box-shadow:0 12px 40px -10px rgba(20,60,70,.5);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .more[hidden]{display:none!important}
  .more a{min-height:48px;display:flex;align-items:center;padding:0 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;background:#F4F9FA}
  .more a.nav-prem{background:#FBE9E3}
  .spread{display:flex;flex-direction:column}
  .spread .col{display:contents}
  .spread .cover{order:1}.spread .cover img{max-height:170px;object-fit:cover;object-position:top left}
  .spread .sheet{order:2}.spread .wpanel{order:3}.spread .tip{order:4}
  .frame{aspect-ratio:auto;min-height:600px;height:auto;max-height:none;border-radius:26px}
  .fl{position:relative;min-height:600px;padding:18px 14px 84px}
  .opt{flex-basis:calc(50% - 12px);min-width:0;min-height:78px}
  .opt .o1{font-size:17px}
  .target{margin-top:48px;min-height:96px}
  .timer{left:126px;right:14px}
  .sel-h{margin-top:48px;font-size:22px}
  .hud{top:16px;left:12px;right:108px;gap:5px;font-size:12.5px;flex-wrap:wrap}
  .hud span{padding:4px 9px}
  .fl .target{margin-top:62px}
  .wpanel{grid-template-columns:1fr}
  .tip{padding:22px 18px}
  .tip .rw{grid-template-columns:auto auto}
  .tip .rw>span:last-child{grid-column:1/-1}
  .site-h{align-items:flex-start}
}

.sv.up::after{top:-.34em}

<script>
const LESSONS = [{"n": 1, "t": "Сам-", "tz": "自己", "h": "如何形成和识别俄语中的复合词", "intro": "当我们谈到俄语中的复合词时，我们指的是由两个或更多基本单元（根）组成的词。这些词在描述不同概念和现象时非常有用，但有时也很难与其他词区分开来。以下是一些建议，可以帮助你更好地理解和记忆复合词。", "cards": [["Самолю́бие", "", "自己+爱=自爱。他爱自己"], ["Самолёт", "", "自己+飞=飞机，这“自己”飞"], ["Самока́т", "", "自己+骑行(кататься)=滑板车。这自己骑"], ["Самоуве́ренный", "", "自己+自信(уверенный)=过于自信的"], ["Самостоя́тельный", "", "自己+站(стоять)=独立。他两腿站稳"], ["Самозащи́та", "", "自己+保护(защищать)=自卫"], ["Самоконтро́ль", "", "自己+控制(контроль)=自我控制"]], "words": [["词组成部分", "将词分成各个部分，看看这些部分是否熟悉。例如：", "само- + стоять = самостоятельный（自己站立 = 独立的）\nвода + воз = водовоз（运水车）", [], ""], ["部分词义", "试图确定每个部分的词义，然后将它们结合起来。", "例如，词 самостоятельный 可以分解为 сам 和 стоять。第一个根表示自主性，第二个根与“站立”有关。将它们联系起来，就得到“自己站立”= 独立。", [], ""], ["拼写规则", "在某些情况下，连接字母被书写出来，在其他情况下则没有。例如：", "самостоятельный → 根之间有连接字母 -о-。\nводовоз → 也有连接字母 -о-。\nстенгазета（墙报）→ 没有连接元音。", [], ""]], "tips": [["这些建议将有助于你轻松应对复杂词汇，并使俄语学习过程变得更加有趣和高效。", "记忆：为了更容易记住复杂的词汇，建议使用联想记忆法。想出一个联想或小故事，帮助把词的各个部分联系起来。\n团体记忆：尝试把相似的词一起记，作为一组。"]], "i18n": {"es": {"tz": "uno mismo, por sí mismo", "h": "Cómo se forman y se reconocen las palabras compuestas en ruso", "intro": "Cuando hablamos de palabras compuestas en ruso, nos referimos a palabras formadas por dos o más unidades básicas (raíces). Son muy útiles para describir conceptos y fenómenos distintos, pero a veces cuesta distinguirlas de otras palabras. Aquí tienes algunos consejos que te ayudarán a entenderlas y recordarlas mejor.", "cards": ["uno mismo + amor = amor propio. Se quiere a sí mismo", "por sí mismo + volar = avión: vuela «solo»", "por sí mismo + rodar (кататься) = patinete: rueda «solo»", "uno mismo + seguro (уверенный) = demasiado seguro de sí mismo, presuntuoso", "por sí mismo + estar de pie (стоять) = independiente: se sostiene sobre sus propios pies", "uno mismo + proteger (защищать) = defensa personal, autodefensa", "uno mismo + control (контроль) = autocontrol"], "words": [{"gloss": "Divide la palabra en sus partes y fíjate si alguna te resulta conocida. Por ejemplo:", "desc": "само- + стоять = самостоятельный (estar de pie por uno mismo = independiente)\nвода + воз = водовоз (camión cisterna de agua, aguador)", "ex": [], "note": "", "head": "Partes de la palabra"}, {"gloss": "Intenta determinar el significado de cada parte y luego combínalos.", "desc": "Por ejemplo, la palabra самостоятельный se puede descomponer en сам y стоять. La primera raíz expresa autonomía; la segunda tiene que ver con «estar de pie». Si las unes, obtienes «sostenerse por uno mismo» = independiente.", "ex": [], "note": "", "head": "Significado de las partes"}, {"gloss": "En algunos casos se escribe una vocal de enlace y en otros no. Por ejemplo:", "desc": "самостоятельный → entre las raíces hay una vocal de enlace -о-.\nводовоз → también lleva la vocal de enlace -о-.\nстенгазета (periódico mural) → no hay vocal de enlace.", "ex": [], "note": "", "head": "Reglas de ortografía"}], "tips": [["Estos consejos te ayudarán a manejar con soltura las palabras complejas y harán que aprender ruso sea más divertido y eficaz.", "Memoria: para recordar mejor las palabras complejas, usa la memoria asociativa. Inventa una asociación o una pequeña historia que conecte las partes de la palabra.\nAprender en grupos: intenta memorizar juntas las palabras parecidas, como una familia."]]}, "en": {"tz": "self", "h": "How Russian compound words are formed and how to recognize them", "intro": "When we talk about compound words in Russian, we mean words made up of two or more basic units (roots). These words are very handy for describing all sorts of ideas and things, but sometimes they can be hard to tell apart from other words. Here are some tips to help you understand and remember compound words better.", "cards": ["self + love = self-love: he loves himself", "self + fly = airplane: it flies \"by itself\"", "self + ride (кататься) = kick scooter: it rolls by itself", "self + confident (уверенный) = overconfident, self-assured", "self + stand (стоять) = independent: standing firmly on one's own two feet", "self + protect (защищать) = self-defense", "self + control (контроль) = self-control"], "words": [{"gloss": "Split the word into its parts and see whether you recognize them. For example:", "desc": "само- + стоять = самостоятельный (standing by oneself = independent)\nвода + воз = водовоз (water truck)", "ex": [], "note": "", "head": "Word parts"}, {"gloss": "Try to work out the meaning of each part, then put them together.", "desc": "For example, the word самостоятельный can be broken down into сам and стоять. The first root expresses independence, the second has to do with \"standing\". Put them together and you get \"standing on one's own\" = independent.", "ex": [], "note": "", "head": "Meaning of the parts"}, {"gloss": "In some cases a linking letter is written, in others it is not. For example:", "desc": "самостоятельный → there is a linking letter -о- between the roots.\nводовоз → also has the linking letter -о-.\nстенгазета (wall newspaper) → no linking vowel.", "ex": [], "note": "", "head": "Spelling rules"}], "tips": [["These tips will help you handle complex words with ease and make learning Russian more fun and effective.", "Memorize with associations: to remember complex words more easily, try association techniques. Come up with an image or a little story that links the parts of the word together.\nMemorize in groups: try learning similar words together, as a set."]]}}}, {"n": 2, "t": "Ду́мать", "tz": "思考，想", "h": "“Думать — 想”是我们每天都在使用的动词，但当它遇到前缀时，意义就会发生变化！今天，我们来讲讲通过给“想”加上不同的前缀，可以创造出哪些神奇的词语！", "intro": "", "cards": [["Поду́мать", "Я подумаю", "我想一想"], ["Приду́мать", "Мы придумали план", "我们想出了计划"], ["Вы́думать", "Он выдумал историю", "他编了故事"], ["Обду́мать", "Он обдумывает предложение", "他在考虑提议"], ["Заду́маться", "Она задумалась", "她开始思考"], ["Переду́мать", "Он передумал и не пошёл", "他改变了主意，不去了"]], "words": [["Приду́мывать / приду́мать", "创造 / 想出 / 构思", "这个词意味着创造一个新的想法。", [["Я придумал новый способ изучать русский язык!", "我想出了学习俄语的新方法！"]], "非常适合那些总是寻找新点子的人！"], ["Переду́мывать / переду́мать", "改变主意", "如果你改变了决定，那就是“改变了主意”。", [["Я передумал ехать в Москву.", "我改变了去莫斯科的决定。"]], "知道什么时候需要重新考虑自己的计划很重要！"], ["Выду́мывать / вы́думать", "编造", "这个词表示编造出一些不真实的、常常是奇异的东西。", [["Я выдумал интересную историю для детей.", "我编了一个有趣的儿童故事。"]], "适合那些喜欢创意和幻想的人！"], ["Заду́мываться / заду́маться", "考虑，陷入沉思", "如果你在思考某件事，那你就是在“考虑”。", [["Я часто задумываюсь о будущем.", "我常常思考未来。"]], "当你在寻找解决方案时，这个词正是为你准备的。"], ["Обду́мывать / обду́мать", "深思", "当你仔细处理信息并做出决定时，你就是在“深思”。", [["Я обдумал все варианты и решил остаться в России.", "我仔细考虑了所有选择，决定留在俄罗斯。"]], ""]], "tips": [["学习建议", "从今天的例子可以看到，给“думать”加上不同前缀，会产生不同的“新意义”：\nпри- → придумать（想出新点子）— 强调“通过思考得出结果”\nпере- → передумать（改变主意）— 强调“重新来一遍、改变”\nвы- → выдумать（编造）— 强调“凭空捏造出来”\nза- → задуматься（陷入沉思）— 强调“开始进入某种状态”\nоб- → обдумать（全面思考）— 强调“从各个角度全面处理”"], ["但要注意：", "同一个前缀，在不同动词里意义并不总是一样！比如：\nпри- → 在“прийти”（到达）里表示“靠近、到达某地”，但在“придумать”里表示“想出新想法”，和“到达”毫无关系。\nвы- → 在“выйти”（走出）里表示“从里向外移动”，但在“выдумать”里表示“凭空编造”，是抽象意义上的“产出”。\n所以记前缀时，不要只背“公式”，而要多看具体动词的例句，感受它在每个词里的独特含义！"]], "i18n": {"es": {"tz": "pensar", "h": "«Думать», pensar, es un verbo que usamos a diario, pero ¡cuando se le añade un prefijo, su significado cambia! Hoy vamos a ver qué palabras sorprendentes se pueden crear añadiendo distintos prefijos a «pensar».", "intro": "", "cards": ["Lo pensaré", "Se nos ocurrió un plan", "Se inventó una historia", "Está considerando la propuesta", "Se quedó pensativa", "Cambió de opinión y no fue"], "words": [{"gloss": "inventar / idear / ocurrírsele a uno", "desc": "Esta palabra significa crear una idea nueva.", "ex": ["¡Se me ocurrió una nueva forma de aprender ruso!"], "note": "¡Perfecta para quienes siempre buscan ideas nuevas!"}, {"gloss": "cambiar de opinión", "desc": "Si cambias tu decisión, has «cambiado de opinión».", "ex": ["Cambié de opinión y ya no voy a Moscú."], "note": "¡Es importante saber cuándo hay que replantearse los planes!"}, {"gloss": "inventar (algo ficticio), fantasear", "desc": "Esta palabra indica inventar algo que no es real, a menudo fantasioso.", "ex": ["Inventé una historia interesante para los niños."], "note": "¡Ideal para quienes disfrutan de la creatividad y la fantasía!"}, {"gloss": "reflexionar, quedarse pensativo", "desc": "Si te pones a pensar en algo, estás «reflexionando».", "ex": ["A menudo me pongo a pensar en el futuro."], "note": "Cuando buscas una solución, esta es tu palabra."}, {"gloss": "meditar, pensar a fondo", "desc": "Cuando analizas la información con detenimiento y tomas una decisión, estás «pensándolo a fondo».", "ex": ["Pensé bien todas las opciones y decidí quedarme en Rusia."], "note": ""}], "tips": [["Consejo de estudio", "Como ves en los ejemplos de hoy, cada prefijo añadido a «думать» crea un «significado nuevo»:\nпри- → придумать (tener una idea nueva) — subraya «llegar a un resultado pensando»\nпере- → передумать (cambiar de opinión) — subraya «volver a hacer, cambiar»\nвы- → выдумать (inventar algo ficticio) — subraya «sacar algo de la nada»\nза- → задуматься (quedarse pensativo) — subraya «empezar a entrar en un estado»\nоб- → обдумать (pensar a fondo) — subraya «tratar algo desde todos los ángulos»"], ["Pero atención:", "¡Un mismo prefijo no siempre significa lo mismo en verbos distintos! Por ejemplo:\nпри- → en «прийти» (llegar) indica «acercarse, llegar a un lugar», pero en «придумать» significa «tener una idea nueva», sin ninguna relación con «llegar».\nвы- → en «выйти» (salir) indica «moverse de dentro hacia fuera», pero en «выдумать» significa «inventar de la nada», una «producción» en sentido abstracto.\nAsí que, al estudiar los prefijos, no te limites a memorizar «fórmulas»: lee muchos ejemplos con verbos concretos y percibe el matiz propio que tiene en cada palabra."]]}, "en": {"tz": "to think", "h": "\"Думать\" (to think) is a verb we use every day, but when it meets a prefix, its meaning changes! Today let's see what amazing words we can create by adding different prefixes to \"think\"!", "intro": "", "cards": ["I'll think about it", "We came up with a plan", "He made up a story", "He is thinking over the proposal", "She became lost in thought", "He changed his mind and didn't go"], "words": [{"gloss": "to create / come up with / devise", "desc": "This word means creating a new idea.", "ex": ["I've come up with a new way to learn Russian!"], "note": "Perfect for people who are always looking for new ideas!"}, {"gloss": "to change one's mind", "desc": "If you change a decision, you have \"changed your mind\".", "ex": ["I changed my mind about going to Moscow."], "note": "It's important to know when to reconsider your plans!"}, {"gloss": "to make up, invent", "desc": "This word means inventing something untrue, often something fantastic.", "ex": ["I made up an interesting story for children."], "note": "Great for those who love creativity and fantasy!"}, {"gloss": "to think about, become lost in thought", "desc": "If you're pondering something, you are \"lost in thought\" about it.", "ex": ["I often think about the future."], "note": "When you're searching for a solution, this word is just for you."}, {"gloss": "to think over, consider carefully", "desc": "When you carefully process information and make a decision, you are \"thinking it over\".", "ex": ["I thought over all the options and decided to stay in Russia."], "note": ""}], "tips": [["Study tip", "As today's examples show, adding different prefixes to \"думать\" produces different \"new meanings\":\nпри- → придумать (come up with a new idea) — emphasizes \"reaching a result through thinking\"\nпере- → передумать (change one's mind) — emphasizes \"doing it over, changing\"\nвы- → выдумать (make up) — emphasizes \"inventing out of thin air\"\nза- → задуматься (become lost in thought) — emphasizes \"starting to enter a state\"\nоб- → обдумать (think through) — emphasizes \"dealing with something thoroughly, from every angle\""], ["But note:", "The same prefix doesn't always mean the same thing in different verbs! For example:\nпри- → in \"прийти\" (to arrive) it means \"approaching, reaching a place\", but in \"придумать\" it means \"coming up with a new idea\", which has nothing to do with \"arriving\".\nвы- → in \"выйти\" (to go out) it means \"moving from inside to outside\", but in \"выдумать\" it means \"inventing out of nothing\", an abstract kind of \"producing\".\nSo when you learn prefixes, don't just memorize \"formulas\" — look at plenty of example sentences with specific verbs and get a feel for what the prefix means in each word!"]]}}}, {"n": 3, "t": "Есть", "tz": "吃", "h": "这些“есть”相关的俄语动词，你都会用吗？есть 不是唯一的“吃”！加上不同前缀，意思完全不同！", "intro": "", "cards": [["Объе́сться", "Я объелся на празднике, теперь тяжело двигаться", "我在聚会上吃撑了，现在动不了"], ["Дое́сть", "Я доел суп и пошёл работать", "我喝完了汤，然后去工作了"], ["Нае́сться", "Я наелся, больше не хочу", "我吃饱了，不想再吃了"], ["Съесть", "Она съела весь торт одна!", "她一个人吃掉了整个蛋糕！"]], "words": [["Пое́сть", "吃一点", "", [["Я хочу немного поесть перед выходом.", "我想出门前吃点东西。"], ["Мне нужно поесть перед тренировкой.", "我训练前要吃点东西。"]], ""], ["Наеда́ться / нае́сться", "吃饱", "", [["Я наелся, больше не могу!", "我吃饱了，再也吃不下了！"], ["После ужина он наелся и лёг спать.", "晚饭后他吃饱了，直接去睡觉。"]], ""], ["Доеда́ть / дое́сть", "吃完", "", [["Ты будешь доедать пиццу?", "你要吃完披萨吗？"], ["Я доел бутерброд и пошёл гулять.", "我吃完三明治就去散步了。"]], ""], ["Объеда́ться / объе́сться", "吃撑", "", [["Я объелся тортом и теперь плохо себя чувствую.", "我蛋糕吃太多了，现在很难受。"], ["Она объелась на банкете и не смогла встать.", "她在宴会上吃撑了，站不起来。"]], ""], ["Съеда́ть / съесть", "吃掉", "", [["Я съел весь шоколад.", "我把巧克力全吃掉了。"], ["Ты съел мой йогурт?!", "你吃了我的酸奶？！"]], ""], ["Перееда́ть / перее́сть", "吃过量", "", [["Вчера я переел и не мог заснуть.", "昨天我吃多了，结果睡不着。"], ["Я переел в ресторане и теперь хочу полежать.", "我在餐厅吃太多了，现在只想躺着。"]], ""]], "tips": [["那 объесться 和 переесть 到底怎么区分？", "Объесться 通常接具体的食物（用工具格：объесться чем — тортом, пиццей），强调“因为吃了太多某样东西而感到不舒服”，比较形象、口语化。\nПереесть 更笼统，不一定针对某种食物，只是说“整体吃太多了”，语气更平和，也更常用来描述“吃撑之后的状态”（比如想躺下、睡不着）。\n也就是说：前缀不同，即使表面意思相近，强调的角度也可能不同 — 学词的时候多留意例句里的搭配，而不是只记中文翻译！"], ["前缀小贴士：объесться 和 переесть 都是“吃太多”，但不完全一样！", "先看看每个前缀在这里的“功能”：\nпо- → поесть（吃点东西）— по- 在这里表示“做一会儿、做到一定程度”，不一定是“量少”，而是“临时性、有限度”地做动作\nна-…-ся → наесться（吃饱）— на-…-ся 常表示“通过动作达到满足/足够的状态”，比如 напиться（喝够、喝醉）\nдо- → доесть（吃完）— до- 表示“把动作做到终点、完成”，比如 дочитать（读完）、доехать（到达目的地）\nобъ- → объесться（吃撑）— об-/объ-…-ся 常表示“做过头，带来不适”，比如 обгореть（晒伤）、облениться（闲久了变懒）\nпере- → переесть（吃过量）— пере- 表示“超过正常限度”，比如 переспать（睡过头）、переработать（工作过度）\nс- → съесть（吃掉）— с- 常常只是完成体的标记，表示“动作彻底完成”，比如 сделать（做完）、спеть（唱完）"]], "i18n": {"es": {"tz": "comer", "h": "¿Sabes usar todos estos verbos rusos relacionados con «есть»? ¡есть no es la única forma de decir «comer»! Con distintos prefijos, el significado cambia por completo.", "intro": "", "cards": ["Me atiborré en la fiesta y ahora me cuesta moverme", "Me terminé la sopa y me fui a trabajar", "Estoy lleno, ya no quiero más", "¡Se comió ella sola toda la tarta!"], "words": [{"gloss": "comer algo, comer un poco", "desc": "", "ex": ["Quiero comer algo antes de salir.", "Tengo que comer algo antes de entrenar."], "note": ""}, {"gloss": "saciarse, quedarse lleno", "desc": "", "ex": ["¡Estoy lleno, no puedo más!", "Después de cenar, ya saciado, se fue a dormir."], "note": ""}, {"gloss": "terminar de comer", "desc": "", "ex": ["¿Te vas a terminar la pizza?", "Me terminé el bocadillo y salí a pasear."], "note": ""}, {"gloss": "atiborrarse, empacharse", "desc": "", "ex": ["Me atiborré de tarta y ahora me encuentro mal.", "Se atiborró en el banquete y no podía levantarse."], "note": ""}, {"gloss": "comerse (todo)", "desc": "", "ex": ["Me comí todo el chocolate.", "¡¿Te has comido mi yogur?!"], "note": ""}, {"gloss": "comer en exceso", "desc": "", "ex": ["Ayer comí demasiado y no podía dormirme.", "Comí demasiado en el restaurante y ahora quiero tumbarme un rato."], "note": ""}], "tips": [["Entonces, ¿cómo se distinguen объесться y переесть?", "Объесться suele llevar un alimento concreto (en instrumental: объесться чем — тортом, пиццей) y subraya «sentirse mal por haber comido demasiado de algo»; es más gráfico y coloquial.\nПереесть es más general, no se refiere necesariamente a un alimento concreto: solo dice «en total comí demasiado». Su tono es más neutro y se usa a menudo para describir el estado después de comer en exceso (querer tumbarse, no poder dormir).\nEs decir: con prefijos distintos, aunque el sentido parezca similar, el punto de vista puede cambiar. ¡Al aprender palabras, fíjate en las combinaciones de los ejemplos y no te quedes solo con la traducción!"], ["Consejo sobre prefijos: объесться y переесть significan los dos «comer demasiado», ¡pero no son iguales!", "Veamos primero qué «función» tiene aquí cada prefijo:\nпо- → поесть (comer algo) — aquí по- indica «hacer algo un rato, hasta cierto punto»; no tanto «poca cantidad», sino una acción temporal y limitada\nна-…-ся → наесться (saciarse) — на-…-ся suele indicar «llegar con la acción a un estado de satisfacción o suficiencia», como напиться (beber hasta saciarse o emborracharse)\nдо- → доесть (terminar de comer) — до- indica «llevar la acción hasta el final, completarla», como дочитать (terminar de leer), доехать (llegar al destino)\nобъ- → объесться (atiborrarse) — об-/объ-…-ся suele indicar «pasarse, con consecuencias desagradables», como обгореть (quemarse con el sol), облениться (volverse perezoso por estar mucho tiempo sin hacer nada)\nпере- → переесть (comer en exceso) — пере- indica «superar el límite normal», como переспать (dormir de más), переработать (trabajar en exceso)\nс- → съесть (comerse) — с- a menudo es solo una marca de perfectivo e indica «acción totalmente completada», como сделать (hacer, terminar de hacer), спеть (cantar, terminar de cantar)"]]}, "en": {"tz": "to eat", "h": "Can you use all these Russian verbs related to \"есть\"? Есть isn't the only way to say \"eat\"! Add different prefixes and the meaning changes completely!", "intro": "", "cards": ["I overate at the party, now it's hard to move", "I finished my soup and went to work", "I'm full, I don't want any more", "She ate the whole cake by herself!"], "words": [{"gloss": "to have something to eat, have a bite", "desc": "", "ex": ["I want to eat a little before going out.", "I need to eat something before my workout."], "note": ""}, {"gloss": "to eat one's fill, be full", "desc": "", "ex": ["I'm full, I can't eat any more!", "After dinner he ate his fill and went to bed."], "note": ""}, {"gloss": "to finish eating", "desc": "", "ex": ["Are you going to finish the pizza?", "I finished my sandwich and went for a walk."], "note": ""}, {"gloss": "to overeat, stuff oneself", "desc": "", "ex": ["I stuffed myself with cake and now I feel bad.", "She overate at the banquet and couldn't get up."], "note": ""}, {"gloss": "to eat up", "desc": "", "ex": ["I ate all the chocolate.", "Did you eat my yogurt?!"], "note": ""}, {"gloss": "to eat too much", "desc": "", "ex": ["Yesterday I ate too much and couldn't fall asleep.", "I ate too much at the restaurant and now I want to lie down."], "note": ""}], "tips": [["So how do you tell объесться and переесть apart?", "Объесться usually takes a specific food (in the instrumental case: объесться чем — тортом, пиццей) and emphasizes \"feeling unwell because you ate too much of something\"; it's more vivid and colloquial.\nПереесть is more general and doesn't necessarily refer to a particular food; it just means \"ate too much overall\". Its tone is milder, and it's often used to describe the state after overeating (wanting to lie down, not being able to sleep).\nIn other words: different prefixes can emphasize different angles even when the basic meaning looks similar — when learning words, pay attention to the collocations in the examples instead of just memorizing a translation!"], ["Prefix tip: объесться and переесть both mean \"eat too much\", but they're not exactly the same!", "First, let's look at what each prefix \"does\" here:\nпо- → поесть (have something to eat) — here по- means \"doing something for a while, to a certain extent\"; it's not necessarily about \"a small amount\", but about doing the action \"temporarily, within limits\"\nна-…-ся → наесться (eat one's fill) — на-…-ся often means \"reaching a state of satisfaction / having enough through the action\", e.g. напиться (drink one's fill, get drunk)\nдо- → доесть (finish eating) — до- means \"carrying the action through to the end, completing it\", e.g. дочитать (finish reading), доехать (reach one's destination)\nобъ- → объесться (stuff oneself) — об-/объ-…-ся often means \"overdoing something, causing discomfort\", e.g. обгореть (get sunburned), облениться (grow lazy from idleness)\nпере- → переесть (eat too much) — пере- means \"going beyond the normal limit\", e.g. переспать (oversleep), переработать (overwork)\nс- → съесть (eat up) — с- is often just a perfective marker, meaning \"the action is fully completed\", e.g. сделать (do, get done), спеть (sing through)"]]}}}, {"n": 4, "t": "Собира́ть", "tz": "收集，收拾，采集", "stub": true, "i18n": {"es": {"tz": "reunir, recoger, recolectar"}, "en": {"tz": "to collect, gather, pack"}}}, {"n": 5, "t": "Дать", "tz": "给", "stub": true, "i18n": {"es": {"tz": "dar"}, "en": {"tz": "to give"}}}, {"n": 6, "t": "(С)проси́ть", "tz": "问", "stub": true, "i18n": {"es": {"tz": "preguntar, pedir"}, "en": {"tz": "to ask"}}}, {"n": 7, "t": "Ступа́ть", "tz": "踏上", "stub": true, "i18n": {"es": {"tz": "pisar, dar un paso"}, "en": {"tz": "to step"}}}, {"n": 8, "t": "Знако́мить", "tz": "介绍", "stub": true, "i18n": {"es": {"tz": "presentar (a alguien)"}, "en": {"tz": "to introduce"}}}, {"n": 9, "t": "-еже", "tz": "每…", "stub": true, "i18n": {"es": {"tz": "cada…"}, "en": {"tz": "every..."}}}, {"n": 10, "t": "По́мнить", "tz": "记得，记住，记忆", "stub": true, "i18n": {"es": {"tz": "recordar, a const LEGAL = {"es":{"terms":{"title":"Términos de uso y condiciones de suscripción","sections":[["1. Quiénes somos","Школа русского («la Web», «Ruso en flujo») es un servicio para aprender vocabulario ruso, operado por [NOMBRE O RAZÓN SOCIAL], con domicilio en [DIRECCIÓN, PAÍS] y número de identificación fiscal [NIF/CIF] («nosotros»). Contacto: [CORREO].","Al crear una cuenta, comprar una suscripción o usar la Web aceptas estos Términos. Si no estás de acuerdo, no uses la Web."],["2. El servicio","La Web ofrece juegos de vocabulario, lecciones sobre raíces y prefijos rusos, un diccionario, el alfabeto y grabaciones de audio.","Parte del contenido es gratuito (nivel A1, lecciones 1 a 3, diccionario, alfabeto y hasta 3 partidas al día). El resto es «Premium» y requiere una suscripción o un pase de pago.","Los audios se han generado con síntesis de voz a partir de la voz de una profesora y pueden contener errores de pronunciación o de acento. El contenido es educativo y no garantiza ningún resultado en exámenes oficiales (ТРКИ/TORFL u otros)."],["3. Cuenta","Puedes usar la parte gratuita sin cuenta. Para Premium necesitas una cuenta, creada con tu correo (con un código de un solo uso) o con Google o Apple.","Debes dar un correo real y mantener el acceso a él. La cuenta es personal: no la compartas ni la revendas. Eres responsable de lo que se haga con ella.","La Web está dirigida a personas de 14 años o más. Si tienes menos edad, necesitas el permiso de tu madre, padre o tutor, que deberá realizar la compra."],["4. Precios y pagos","Los precios vigentes se muestran en la página Premium antes de pagar, con los impuestos aplicables incluidos salvo que se indique lo contrario.","Los pagos los procesa Stripe Payments Europe, Ltd. u otra entidad del grupo Stripe. Nosotros no vemos ni guardamos los datos completos de tu tarjeta ni de tus cuentas de Apple Pay, Google Pay, WeChat Pay o Alipay.","Podemos cambiar los precios. Si tienes una suscripción, te avisaremos por correo al menos 30 días antes; el nuevo precio se aplicará en la siguiente renovación y podrás cancelar antes de que ocurra."],["5. Suscripción con renovación automática (tarjeta, Apple Pay, Google Pay)","La suscripción mensual o anual se renueva automáticamente al final de cada periodo y se cobra con el mismo método de pago, hasta que la canceles.","Puedes cancelar cuando quieras desde «Mi cuenta» → «Gestionar suscripción». La cancelación evita la siguiente renovación; mantienes el acceso Premium hasta el final del periodo ya pagado.","Si un cobro de renovación falla, podremos reintentarlo durante unos días; si sigue fallando, el acceso Premium se suspenderá."],["6. Pase de pago único (WeChat Pay, Alipay)","Con WeChat Pay o Alipay compras un pase de 1 mes o de 12 meses. No se renueva automáticamente: cuando vence, vuelves a la versión gratuita salvo que compres otro pase.","Si compras un pase antes de que venza el anterior, el tiempo nuevo se suma al final."],["7. Sin reembolsos y derecho de desistimiento","Salvo que la ley aplicable lo exija, los pagos no son reembolsables, ni total ni parcialmente, tampoco por periodos no usados.","Si eres consumidor en la Unión Europea, tienes en principio un derecho de desistimiento de 14 días para contratos a distancia. Como Premium es contenido digital que se te entrega de inmediato, antes de pagar te pedimos tu consentimiento expreso para empezar a usarlo ya y que reconozcas que con ello pierdes ese derecho de desistimiento. Si no das ese consentimiento, no podrás completar la compra.","Esto no afecta a tus derechos legales si el servicio no funciona como se describe. En ese caso, escríbenos a [CORREO] y lo resolveremos."],["8. Uso aceptable","No puedes: copiar, descargar masivamente, redistribuir o vender el contenido (textos, ilustraciones, audios); eludir el bloqueo del contenido Premium; usar robots o programas para extraer contenido; interferir con el funcionamiento de la Web; ni usar la Web para actividades ilegales.","Si incumples estos Términos podremos suspender o cerrar tu cuenta. Si el incumplimiento es grave, sin reembolso."],["9. Propiedad intelectual","El contenido de la Web —incluidas las lecciones, explicaciones, ilustraciones, listas de vocabulario, diseño, código y grabaciones de voz— pertenece a [NOMBRE O RAZÓN SOCIAL] o a sus autores y licenciantes ([AUTOR DEL LIBRO], [NOMBRE DE LA PROFESORA]).","La suscripción te da una licencia personal, no exclusiva e intransferible para usar el contenido dentro de la Web con fines de estudio. No te transfiere ningún otro derecho."],["10. Disponibilidad y cambios del servicio","Trabajamos para que la Web funcione siempre, pero no garantizamos que esté libre de errores o interrupciones. Podemos mejorar, cambiar o retirar funciones o contenidos.","Si retiramos una parte esencial del contenido Premium mientras tienes una suscripción activa, podrás cancelar y te devolveremos la parte proporcional no disfrutada."],["11. Responsabilidad","Usas la Web bajo tu propia responsabilidad. En la medida en que la ley lo permita, no respondemos de daños indirectos ni de pérdidas de datos, y nuestra responsabilidad total queda limitada al importe que nos hayas pagado en los 12 meses anteriores.","Nada de lo anterior limita la responsabilidad que la ley no permita limitar, por ejemplo por dolo o negligencia grave, ni tus derechos como consumidor."],["12. Cierre de la cuenta","Puedes borrar tu cuenta en cualquier momento desde «Mi cuenta» → «Borrar mi cuenta» o escribiendo a [CORREO]. Al borrarla se cancela también la suscripción con renovación automática, sin reembolso de lo ya pagado.","Podemos cerrar cuentas inactivas durante más de 24 meses, avisando antes por correo."],["13. Cambios en estos Términos","Podemos actualizar estos Términos. Si el cambio es importante, te avisaremos por correo o en la Web al menos 30 días antes. Si no estás de acuerdo, puedes cancelar antes de que entre en vigor."],["14. Ley aplicable y reclamaciones","Estos Términos se rigen por la ley de [PAÍS]. Si eres consumidor, conservas la protección de las normas imperativas de tu país de residencia y puedes reclamar ante los tribunales de tu domicilio.","Los consumidores de la UE también pueden usar la plataforma europea de resolución de litigios en línea: https://ec.europa.eu/consumers/odr.","Existen versiones de estos Términos en español, chino e inglés. En caso de discrepancia prevalece la versión en español."]]},"privacy":{"title":"Política de privacidad","sections":[["1. Responsable","El responsable del tratamiento de tus datos es [NOMBRE O RAZÓN SOCIAL], [DIRECCIÓN, PAÍS], [NIF/CIF]. Contacto para privacidad: [CORREO]."],["2. Qué datos tratamos","Si solo usas la parte gratuita sin cuenta, no recogemos datos personales en nuestros servidores. Tu progreso y tus ajustes se guardan solo en tu navegador (almacenamiento local).","Si creas una cuenta: tu correo electrónico y, si entras con Google o Apple, el identificador y el nombre que esos servicios nos envían.","Si eres Premium: tu progreso de estudio (palabras dominadas, puntuaciones, lecciones completadas, palabras por repasar), para sincronizarlo entre dispositivos.","Si pagas: el estado de tu suscripción o pase, el plan, las fechas y el identificador de cliente de Stripe. Los datos de pago (tarjeta, Apple Pay, Google Pay, WeChat Pay, Alipay) los trata directamente Stripe; nosotros no los recibimos.","Datos técnicos: los servidores registran de forma automática datos como la dirección IP, el navegador y la fecha de acceso, por seguridad y para que el servicio funcione."],["3. Para qué y con qué base legal","Crear y gestionar tu cuenta y darte acceso al contenido: ejecución del contrato.","Cobrar, facturar y cumplir obligaciones fiscales: ejecución del contrato y obligación legal.","Sincronizar tu progreso: ejecución del contrato (es parte de Premium).","Seguridad y prevención de abusos: interés legítimo.","Enviarte avisos sobre tu cuenta o cambios en las condiciones: ejecución del contrato. No enviamos publicidad sin tu consentimiento."],["4. Con quién compartimos los datos","Solo con proveedores que necesitamos para dar el servicio, que actúan por cuenta nuestra:","• Supabase Inc. (base de datos, inicio de sesión y almacenamiento; región del servidor: [REGIÓN, p. ej. UE – Fráncfort]).","• Stripe (procesamiento de pagos; Stripe es responsable de los datos de pago que trata).","• [PROVEEDOR DE HOSTING, p. ej. Netlify] (alojamiento de la Web).","• Google y Apple, solo si eliges entrar con ellos.","• Google Fonts: al cargar la Web, tu navegador descarga tipografías de los servidores de Google, que reciben tu dirección IP.","No vendemos tus datos ni los usamos para publicidad."],["5. Transferencias internacionales","Algunos proveedores pueden tratar datos fuera de tu país (por ejemplo, en Estados Unidos). En ese caso se usan garantías adecuadas, como las cláusulas contractuales tipo de la Comisión Europea.","Si vives en China continental: tus datos se almacenan y tratan fuera de China. Al crear una cuenta das tu consentimiento separado a esta transferencia transfronteriza, de acuerdo con la Ley de Protección de Información Personal (PIPL)."],["6. Cuánto tiempo los guardamos","Datos de la cuenta y progreso: mientras tengas la cuenta. Si la cierras, los borramos en un plazo de 30 días.","Datos de facturación: el tiempo que exija la ley fiscal ([PLAZO, p. ej. 6 años]).","Registros técnicos: un máximo de [90] días."],["7. Tus derechos","Puedes pedir acceso a tus datos, rectificarlos, borrarlos, limitar u oponerte a su tratamiento, y recibirlos en un formato portable. Escríbenos a [CORREO]; te responderemos en un plazo máximo de un mes.","Si crees que no hemos tratado bien tus datos, puedes reclamar ante la autoridad de protección de datos de tu país ([AUTORIDAD, p. ej. la AEPD en España: www.aepd.es])."],["8. Almacenamiento en tu navegador (cookies)","No usamos cookies de publicidad ni de analítica. Usamos el almacenamiento local del navegador solo para lo necesario: tu progreso, tus ajustes, el idioma y, si inicias sesión, mantener la sesión abierta. Puedes borrarlo desde los ajustes de tu navegador.","Si en el futuro añadimos analítica o publicidad, te pediremos permiso antes."],["9. Menores","La Web está dirigida a personas de 14 años o más. Si tienes menos edad, necesitas el permiso de tu madre, padre o tutor. Si sabemos que hemos recogido datos de un menor sin ese permiso, los borraremos."],["10. Seguridad","Usamos conexiones cifradas (HTTPS), inicio de sesión sin contraseñas y control de acceso a nivel de base de datos, de modo que cada persona solo puede ver sus propios datos."],["11. Cambios","Si cambiamos esta política de forma importante, te avisaremos en la Web o por correo."]]}},"zh":{"terms":{"title":"使用条款与订阅条款","sections":[["1. 我们是谁","Школа русского（以下简称“本网站”“俄语心流”）是一项学习俄语词汇的服务，由 [姓名或公司名称] 运营，地址：[地址，国家]，税号：[税号]（以下简称“我们”）。联系方式：[邮箱]。","创建账户、购买订阅或使用本网站，即表示你接受本条款。如不同意，请不要使用本网站。"],["2. 服务内容","本网站提供词汇游戏、俄语词根与前缀课程、词典、字母表和音频。","部分内容免费（A1 级别、第 1–3 课、词典、字母表，以及每天最多 3 局游戏）。其余内容为“高级版”，需要订阅或购买付费通行证。","音频是根据一位老师的声音用语音合成技术生成的，可能存在发音或重音错误。本内容仅用于学习，不保证任何官方考试（ТРКИ/TORFL 等）的成绩。"],["3. 账户","免费部分无需账户即可使用。高级版需要账户，可以用邮箱（一次性验证码）或 Google、Apple 账户创建。","你必须提供真实的邮箱并保持可以使用。账户仅限本人使用，不得共享或转售。你需对账户下发生的行为负责。","本网站面向 14 岁及以上的用户。未满 14 岁需取得父母或监护人同意，并由其完成购买。"],["4. 价格与付款","付款前，高级版页面会显示当前价格；除非另有说明，价格已包含适用税费。","付款由 Stripe Payments Europe, Ltd. 或 Stripe 集团的其他公司处理。我们不会看到或保存你完整的银行卡信息，也不会获取你的 Apple Pay、Google Pay、微信支付或支付宝账户信息。","我们可能调整价格。如果你有订阅，我们会至少提前 30 天通过邮件通知；新价格从下一次续订开始生效，你可以在此之前取消。"],["5. 自动续订的订阅（银行卡、Apple Pay、Google Pay）","月度或年度订阅会在每个周期结束时自动续订，并从同一付款方式扣款，直到你取消为止。","你可以随时在“我的账户”→“管理订阅”中取消。取消后不会再续订；在已付费的周期结束前，你仍可使用高级版。","如果续订扣款失败，我们可能会在几天内重试；如仍失败，高级版权限将被暂停。"],["6. 一次性通行证（微信支付、支付宝）","使用微信支付或支付宝，你购买的是 1 个月或 12 个月的通行证。它不会自动续订：到期后将恢复为免费版，除非你再次购买。","如果在上一张通行证到期前购买新的通行证，新时间会累加在后面。"],["7. 不予退款与撤回权","除适用法律另有规定外，所有付款均不退还，包括全部或部分退款，也不因未使用的时间退款。","如果你是欧盟的消费者，远程签订的合同通常享有 14 天撤回权。由于高级版是立即提供的数字内容，付款前我们会请你明确同意立即开始使用，并确认你因此放弃该撤回权。不同意则无法完成购买。","以上不影响你在服务与描述不符时的法定权利。如遇此类情况，请写信至 [邮箱]，我们会处理。"],["8. 使用规范","你不得：复制、批量下载、转发或出售本网站内容（文字、插图、音频）；绕过高级版的限制；使用机器人或程序抓取内容；干扰本网站运行；或将本网站用于违法活动。","如违反本条款，我们可以暂停或关闭你的账户；情节严重的，不予退款。"],["9. 知识产权","本网站的内容——包括课程、讲解、插图、词汇表、设计、代码和语音——归 [姓名或公司名称] 或其作者和授权方（[书籍作者]、[老师姓名]）所有。","订阅仅授予你个人的、非独占的、不可转让的许可，可在本网站内用于学习，不转让其他任何权利。"],["10. 服务的可用性与变更","我们努力保证网站正常运行，但不保证没有错误或中断。我们可能改进、修改或下线某些功能或内容。","如果在你的订阅有效期间，我们下线了高级版的核心内容，你可以取消订阅，我们将按比例退还未使用部分的费用。"],["11. 责任","你使用本网站的风险由你自行承担。在法律允许的范围内，我们不对间接损失或数据丢失负责，我们的全部责任以你在过去 12 个月内向我们支付的金额为限。","以上内容不限制法律不允许限制的责任（例如故意或重大过失），也不影响你作为消费者的权利。"],["12. 注销账户","你可以随时在“我的账户”→“删除我的账户”中删除账户，或写信至 [邮箱] 申请。删除账户时，自动续订的订阅也会一并取消，已付款项不予退还。","超过 24 个月未使用的账户，我们可能在邮件通知后将其关闭。"],["13. 条款变更","我们可能更新本条款。如有重要变更，我们会至少提前 30 天通过邮件或在网站上通知。如不同意，你可以在生效前取消。"],["14. 适用法律与投诉","本条款适用 [国家] 法律。如果你是消费者，你仍受你居住国强制性法律的保护，并可向你住所地的法院提起诉讼。","欧盟消费者也可以使用欧盟在线争议解决平台：https://ec.europa.eu/consumers/odr。","本条款有西班牙语、中文和英语版本。如有不一致，以西班牙语版本为准。"]]},"privacy":{"title":"隐私政策","sections":[["1. 数据控制者","你的个人信息处理者为 [姓名或公司名称]，[地址，国家]，[税号]。隐私事务联系方式：[邮箱]。"],["2. 我们处理哪些数据","如果你不注册账户、只使用免费部分，我们的服务器不会收集你的个人信息。你的学习进度和设置只保存在你的浏览器里（本地存储）。","如果你创建账户：你的邮箱地址；如果你用 Google 或 Apple 登录，还包括这些服务发送给我们的标识符和名字。","如果你是高级版用户：你的学习进度（已掌握的词、分数、完成的课程、待复习的词），用于在不同设备间同步。","如果你付款：订阅或通行证的状态、方案、日期和你的 Stripe 客户编号。付款信息（银行卡、Apple Pay、Google Pay、微信支付、支付宝）由 Stripe 直接处理，我们不会收到。","技术数据：服务器会自动记录 IP 地址、浏览器和访问时间等信息，用于安全和保障服务运行。"],["3. 处理目的与法律依据","创建和管理账户，并为你提供内容：履行合同。","收费、开具发票和履行税务义务：履行合同和法定义务。","同步学习进度：履行合同（高级版的一部分）。","安全和防止滥用：正当利益。","发送关于账户或条款变更的通知：履行合同。未经你同意，我们不会发送广告。"],["4. 我们与谁共享数据","仅与提供服务所必需的服务商共享，它们代表我们处理数据：","• Supabase Inc.（数据库、登录和存储；服务器区域：[区域，例如 欧盟－法兰克福]）。","• Stripe（支付处理；Stripe 对其处理的支付数据负责）。","• [网站托管服务商，例如 Netlify]（网站托管）。","• Google 和 Apple，仅在你选择用它们登录时。","• Google Fonts：打开网站时，你的浏览器会从 Google 的服务器下载字体，Google 会收到你的 IP 地址。","我们不会出售你的数据，也不会把它用于广告。"],["5. 跨境传输","部分服务商可能在你所在国家以外（例如美国）处理数据。在这种情况下，我们会采取适当的保障措施，例如欧盟委员会的标准合同条款。","如果你居住在中国大陆：你的个人信息将在中国境外存储和处理。创建账户时，你将根据《个人信息保护法》就此跨境传输单独作出同意。"],["6. 保存期限","账户数据和学习进度：在你的账户存续期间保存。注销账户后，我们会在 30 天内删除。","账单数据：按照税法要求的期限保存（[期限，例如 6 年]）。","技术日志：最长 [90] 天。"],["7. 你的权利","你可以要求查阅、更正、删除你的个人信息，限制或反对对其的处理，以及以可携带的格式获取你的数据。请写信至 [邮箱]，我们会在一个月内答复。","如果你认为我们没有妥善处理你的数据，可以向你所在国家的数据保护机构投诉（[机构，例如 西班牙数据保护局 www.aepd.es]）。"],["8. 浏览器存储（Cookie）","我们不使用广告或分析类 Cookie。我们只在必要时使用浏览器的本地存储：你的学习进度、设置、语言，以及在你登录后保持登录状态。你可以在浏览器设置中清除。","如果将来加入数据分析或广告，我们会事先征求你的同意。"],["9. 未成年人","本网站面向 14 岁及以上的用户。未满 14 岁需取得父母或监护人同意。如果我们发现在未取得同意的情况下收集了未成年人的信息，将予以删除。"],["10. 安全","我们使用加密连接（HTTPS）、无密码登录和数据库级别的访问控制，每个人只能看到自己的数据。"],["11. 政策变更","如果本政策有重要变更，我们会在网站上或通过邮件通知你。"]]}},"en":{"terms":{"title":"Terms of Use and Subscription Terms","sections":[["1. Who we are","Школа русского (the “Site”, “Russian in Flow”) is a service for learning Russian vocabulary, operated by [NAME OR COMPANY NAME], located at [ADDRESS, COUNTRY], tax ID [TAX ID] (“we”). Contact: [EMAIL].","By creating an account, buying a subscription or using the Site you accept these Terms. If you do not agree, do not use the Site."],["2. The service","The Site offers vocabulary games, lessons on Russian roots and prefixes, a dictionary, the alphabet and audio recordings.","Part of the content is free (level A1, lessons 1 to 3, dictionary, alphabet and up to 3 games a day). The rest is “Premium” and requires a subscription or a paid pass.","The audio was generated by speech synthesis from a teacher’s voice and may contain pronunciation or stress errors. The content is educational and does not guarantee any result in official exams (ТРКИ/TORFL or others)."],["3. Account","You can use the free part without an account. Premium requires an account, created with your email (using a one-time code) or with Google or Apple.","You must provide a real email and keep access to it. Your account is personal: do not share or resell it. You are responsible for what is done with it.","The Site is intended for people aged 14 or over. If you are younger, you need permission from a parent or guardian, who must make the purchase."],["4. Prices and payments","Current prices are shown on the Premium page before you pay, including applicable taxes unless stated otherwise.","Payments are processed by Stripe Payments Europe, Ltd. or another Stripe group company. We do not see or store your full card details or your Apple Pay, Google Pay, WeChat Pay or Alipay account details.","We may change prices. If you have a subscription, we will notify you by email at least 30 days in advance; the new price applies from the next renewal and you may cancel before then."],["5. Auto-renewing subscription (card, Apple Pay, Google Pay)","The monthly or yearly subscription renews automatically at the end of each period and is charged to the same payment method until you cancel.","You can cancel at any time from “Account” → “Manage subscription”. Cancelling stops the next renewal; you keep Premium access until the end of the period already paid.","If a renewal charge fails, we may retry it for a few days; if it keeps failing, Premium access will be suspended."],["6. One-time pass (WeChat Pay, Alipay)","With WeChat Pay or Alipay you buy a 1-month or 12-month pass. It does not renew automatically: when it expires you return to the free version unless you buy another pass.","If you buy a pass before the previous one expires, the new time is added at the end."],["7. No refunds and right of withdrawal","Unless required by applicable law, payments are non-refundable, in whole or in part, including for unused periods.","If you are a consumer in the European Union, you generally have a 14-day right of withdrawal for distance contracts. Because Premium is digital content supplied immediately, before you pay we ask for your express consent to start using it right away and your acknowledgement that you thereby lose that right of withdrawal. Without that consent you cannot complete the purchase.","This does not affect your statutory rights if the service does not work as described. In that case, write to [EMAIL] and we will fix it."],["8. Acceptable use","You may not: copy, bulk-download, redistribute or sell the content (texts, illustrations, audio); circumvent the Premium lock; use bots or programs to extract content; interfere with the operation of the Site; or use the Site for illegal activities.","If you breach these Terms we may suspend or close your account. For serious breaches, without refund."],["9. Intellectual property","The content of the Site — including lessons, explanations, illustrations, vocabulary lists, design, code and voice recordings — belongs to [NAME OR COMPANY NAME] or its authors and licensors ([BOOK AUTHOR], [TEACHER’S NAME]).","Your subscription gives you a personal, non-exclusive, non-transferable licence to use the content within the Site for study. It does not transfer any other rights."],["10. Availability and changes","We work to keep the Site running, but we do not guarantee it will be free of errors or interruptions. We may improve, change or withdraw features or content.","If we withdraw an essential part of the Premium content while you have an active subscription, you may cancel and we will refund the unused proportional part."],["11. Liability","You use the Site at your own risk. To the extent permitted by law, we are not liable for indirect damages or data loss, and our total liability is limited to the amount you paid us in the previous 12 months.","Nothing above limits liability that cannot be limited by law, for example for wilful misconduct or gross negligence, nor your consumer rights."],["12. Closing your account","You can delete your account at any time from “Account” → “Delete my account” or by writing to [EMAIL]. Deleting it also cancels any auto-renewing subscription, without refund of payments already made.","We may close accounts inactive for more than 24 months, after notifying you by email."],["13. Changes to these Terms","We may update these Terms. For important changes we will notify you by email or on the Site at least 30 days in advance. If you do not agree, you may cancel before they take effect."],["14. Governing law and complaints","These Terms are governed by the law of [COUNTRY]. If you are a consumer, you keep the protection of the mandatory rules of your country of residence and may bring claims before the courts of your domicile.","EU consumers may also use the European Online Dispute Resolution platform: https://ec.europa.eu/consumers/odr.","These Terms exist in Spanish, Chinese and English. In case of discrepancy, the Spanish version prevails."]]},"privacy":{"title":"Privacy Policy","sections":[["1. Controller","The controller of your data is [NAME OR COMPANY NAME], [ADDRESS, COUNTRY], [TAX ID]. Privacy contact: [EMAIL]."],["2. What data we process","If you only use the free part without an account, we do not collect personal data on our servers. Your progress and settings are stored only in your browser (local storage).","If you create an account: your email address and, if you sign in with Google or Apple, the identifier and name those services send us.","If you are Premium: your study progress (words mastered, scores, lessons completed, words to review), to sync it across devices.","If you pay: the status of your subscription or pass, the plan, dates and your Stripe customer ID. Payment data (card, Apple Pay, Google Pay, WeChat Pay, Alipay) is processed directly by Stripe; we do not receive it.","Technical data: servers automatically log data such as IP address, browser and access time, for security and to run the service."],["3. Purposes and legal bases","Creating and managing your account and giving you access to content: performance of the contract.","Charging, invoicing and meeting tax obligations: performance of the contract and legal obligation.","Syncing your progress: performance of the contract (it is part of Premium).","Security and abuse prevention: legitimate interest.","Sending notices about your account or changes to the terms: performance of the contract. We do not send advertising without your consent."],["4. Who we share data with","Only with providers we need to run the service, acting on our behalf:","• Supabase Inc. (database, sign-in and storage; server region: [REGION, e.g. EU – Frankfurt]).","• Stripe (payment processing; Stripe is responsible for the payment data it processes).","• [HOSTING PROVIDER, e.g. Netlify] (website hosting).","• Google and Apple, only if you choose to sign in with them.","• Google Fonts: when the Site loads, your browser downloads fonts from Google’s servers, which receive your IP address.","We do not sell your data or use it for advertising."],["5. International transfers","Some providers may process data outside your country (for example, in the United States). In that case appropriate safeguards are used, such as the European Commission’s standard contractual clauses.","If you live in mainland China: your data is stored and processed outside China. By creating an account you give separate consent to this cross-border transfer under the Personal Information Protection Law (PIPL)."],["6. How long we keep data","Account data and progress: while you have the account. If you close it, we delete them within 30 days.","Billing data: as long as tax law requires ([PERIOD, e.g. 6 years]).","Technical logs: up to [90] days."],["7. Your rights","You can request access to your data, correct it, delete it, restrict or object to its processing, and receive it in a portable format. Write to [EMAIL]; we will reply within one month.","If you believe we have not handled your data properly, you can complain to the data protection authority in your country ([AUTHORITY, e.g. AEPD in Spain: www.aepd.es])."],["8. Browser storage (cookies)","We do not use advertising or analytics cookies. We use the browser’s local storage only for what is necessary: your progress, settings, language and, if you sign in, keeping you signed in. You can clear it in your browser settings.","If we add analytics or advertising in the future, we will ask for your permission first."],["9. Children","The Site is intended for people aged 14 or over. If you are younger, you need permission from a parent or guardian. If we learn we have collected data from a minor without that permission, we will delete it."],["10. Security","We use encrypted connections (HTTPS), passwordless sign-in and database-level access control, so each person can only see their own data."],["11. Changes","If we change this policy in an important way, we will notify you on the Site or by email."]]}}};
