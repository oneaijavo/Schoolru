/* ---------------- state & storage ---------------- */
const store={get(k,d){try{const v=localStorage.getItem('sor.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sor.'+k,JSON.stringify(v))}catch(e){} if(SYNC_KEYS.includes(k)) queueSync();}};
const SYNC_KEYS=['boxes','bests','missed','ldone'];
const S={lang:store.get('lang','zh'),route:'home',
  cfg:Object.assign({target:'text',stress:true,timer:true,voice:true,sfx:true},store.get('cfg',{})),
  lvTab:store.get('lvTab','A1')};
let boxes=store.get('boxes',{}), bests=store.get('bests',{}), missedIds=store.get('missed',{}), lessonDone=store.get('ldone',{});
const $=s=>document.querySelector(s);
const t=(k,o)=>{let s=T[S.lang][k]??T.zh[k]??k; if(o&&typeof s==='string')for(const x in o)s=s.split('{'+x+'}').join(o[x]); return s;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>s.normalize('NFD').replace(/́/g,'').normalize('NFC');
const showRu=s=>S.cfg.stress?s:strip(s);
const hasCyr=s=>/[А-Яа-яЁё]/.test(s);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------------- audio ---------------- */
const akey=s=>strip(s).replace(/[（(][^）)]*[）)]/g,'').replace(/[.!?…]+$/,'').trim().toLowerCase();
const ANORM={}; for(const k in AIDX) ANORM[akey(k)]=AIDX[k];
let pState='idle', ABUF=null, PBUF=null, AURL={}, aState='idle', curAudio=null, curBtn=null;
function loadAudio(){
  if(aState!=='idle')return; aState='loading'; setAState();
  fetch('audio.mp3').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();}).then(b=>{ABUF=b;aState='ready';setAState();}).catch(()=>{aState='fail';setAState();});
}
function setAState(){const el=$('#audio-state'); if(el) el.textContent=aState==='loading'?t('a_loading'):aState==='ready'?t('a_ready'):aState==='fail'?t('a_fail'):'';}
function clipURL(text){
  const k=akey(text), e=ANORM[k]; if(!e) return null; const buf=e[2]==='p'?PBUF:ABUF; if(!buf) return null;
  if(!AURL[k]) AURL[k]=URL.createObjectURL(new Blob([buf.slice(e[0],e[0]+e[1])],{type:'audio/mpeg'}));
  return AURL[k];
}
function speak(text,btn){
  if(!S.cfg.voice&&!btn) return;
  const u=clipURL(text);
  try{ if(curAudio){curAudio.pause();} }catch(e){}
  if(curBtn){curBtn.classList.remove('playing');curBtn=null;}
  if(u){ const a=new Audio(u); curAudio=a; if(btn){curBtn=btn;btn.classList.add('playing');a.onended=()=>btn.classList.remove('playing');} a.play().catch(()=>{}); return; }
  const isP=(ANORM[akey(text)]||[])[2]==='p';
  if((!isP&&aState==='loading')||(isP&&pState==='loading')){ const iv=setInterval(()=>{ const st=isP?pState:aState; if(st!=='loading'){clearInterval(iv); if(st==='ready')speak(text,btn);} },150); return; }
  // fallback: device voice
  try{ if('speechSynthesis' in window){ const v=speechSynthesis.getVoices().find(x=>/^ru/i.test(x.lang)); if(v){speechSynthesis.cancel(); const ut=new SpeechSynthesisUtterance(strip(text)); ut.voice=v; ut.lang='ru-RU'; speechSynthesis.speak(ut);} } }catch(e){}
}
let actx=null;
function sfx(ok){ if(!S.cfg.sfx)return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const now=actx.currentTime;
  const notes=ok?[[660,0],[990,.09]]:[[200,0],[150,.1]];
  notes.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,now+d);g.gain.exponentialRampToValueAtTime(ok?.18:.06,now+d+.01);g.gain.exponentialRampToValueAtTime(0.0001,now+d+.16);o.connect(g).connect(actx.destination);o.start(now+d);o.stop(now+d+.18);}); }catch(e){} }
const SPK='<svg viewBox="0 0 24 24"><use href="#i-spk"/></svg>';
const sayBtn=ru=>`<button class="say" data-say="${esc(ru)}" aria-label="▶ ${esc(strip(ru))}">${SPK}</button>`;
document.addEventListener('pointerdown',loadAudio,{once:true});
document.addEventListener('keydown',loadAudio,{once:true});
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.preventDefault();e.stopPropagation();loadAudio();speak(b.dataset.say,b);}},true);

function buildContent(){
for(const k in ITEMS) delete ITEMS[k]; for(const k in SETS) delete SETS[k]; for(const k in DECKS) delete DECKS[k];
for(const k in RAW){ const list=RAW[k].trim().split('\n').map((l,i)=>{const[ru,zh,es,en,cat]=l.split('|');const it={id:k+'-'+i,ru,tr:{zh,es,en},src:k,cat:cat||''};ITEMS[it.id]=it;return it;});

    G.score+=10+Math.min(G.streak,10)*2; q.run++; G.time=Math.min(1,G.time+.16);
    if(!G.missed.has(q.it.id)) boxes[q.it.id]=Math.min(5,(boxes[q.it.id]??0)+(q.run>=2?1:0));

function applyPremium(c){
  if(PREM_APPLIED||!c) return;
  (c.lessons||[]).forEach(L=>{LESSONS[L.n-1]=L;});
  if(c.a2) RAW.A2=c.a2;
  if(c.b1) RAW.B1=c.b1;
  if(c.aidx) for(const k in c.aidx) ANORM[akey(k)]=[c.aidx[k][0],c.aidx[k][1],'p'];
  buildContent(); PREM_APPLIED=true;
}
function loadDemoPremiumAudio(){ if(PBUF||pState==='loading'||!DEMO) return; pState='loading';
  Promise.all(['audio-premium-1.mp3','audio-premium-2.mp3'].map(u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}))).then(bs=>{ const n=bs.reduce((a,b)=>a+b.byteLength,0), u=new Uint8Array(n); let o=0; bs.forEach(b=>{u.set(new Uint8Array(b),o);o+=b.byteLength;}); PBUF=u.buffer; pState='ready'; }).catch(()=>{pState='fail';}); }
function unlockDemo(pass){ ACC.premium=true; const days=pass==='yearly'?365:30; ACC.sub={status:'active',current_period_end:new Date(Date.now()+days*864e5).toISOString(),cancel_at_period_end:!!pass,price_id:pass?'pass_'+pass:'demo'}; applyPremium(PREMIUM_INLINE); loadDemoPremiumAudio(); }
async function refreshSub(){
  if(!ACC.user){ ACC.premium=false; ACC.sub=null; render(); return; }
  const {data}=await sb.from('subscriptions').select('status,current_period_end,cancel_at_period_end,price_id,stripe_subscription_id').maybeSingle();
  ACC.sub=data||null;
  const active=!!data&&['active','trialing'].includes(data.status)&&(!data.current_period_end||new Date(data.current_period_end)>new Date());
  if(active&&!PREM_APPLIED){ const r=await sb.functions.invoke('premium-content'); if(r.data&&r.data.content){ applyPremium(r.data.content); if(r.data.audioUrl){ pState='loading'; fetch(r.data.audioUrl).then(x=>{if(!x.ok)throw 0;return x.arrayBuffer();}).then(b=>{PBUF=b;pState='ready';}).catch(()=>{pState='fail';}); } } }
  ACC.premium=active&&PREM_APPLIED;
  if(ACC.premium) await pullProgress();
  render();
}
let syncT=null;
function queueSync(){ try{ if(!LIVE||!ACC.user||!ACC.premium) return; }catch(e){ return; } clearTimeout(syncT); syncT=setTimeout(pushProgress,2500); }
async function pushProgress(){ try{ await sb.from('progress').upsert({user_id:ACC.user.id,data:{boxes,bests,missed:missedIds,ldone:lessonDone},updated_at:new Date().toISOString()}); }catch(e){} }
async function pullProgress(){
  try{ const {data}=await sb.from('progress').select('data').maybeSingle(); const d=data&&data.data; if(!d) { pushProgress(); return; }
    const mx=(a,b)=>{for(const k in b) a[k]=Math.max(a[k]||0,b[k]||0); return a;};
    boxes=mx(boxes,d.boxes||{}); bests=mx(bests,d.bests||{}); lessonDone=mx(lessonDone,d.ldone||{}); missedIds=Object.assign({},d.missed||{},missedIds);
    try{localStorage.setItem('sor.boxes',JSON.stringify(boxes));localStorage.setItem('sor.bests',JSON.stringify(bests));localStorage.setItem('sor.ldone',JSON.stringify(lessonDone));localStorage.setItem('sor.missed',JSON.stringify(missedIds));}catch(e){}
    pushProgress(); }catch(e){}
}
async function initAuth(){
  if(LIVE){
    try{ await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
      sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
      const {data}=await sb.auth.getSession(); ACC.user=data.session?.user||null; await refreshSub();
      sb.auth.onAuthStateChange((ev,session)=>{ const u=session?.user||null; if((u&&u.id)!==(ACC.user&&ACC.user.id)){ ACC.user=u; refreshSub(); } });

      if(/[?&]checkout=success/.test(location.search)){ try{history.replaceState(null,'',location.pathname+'#account');}catch(e){} S.route='account'; render();

    ACC.premium=true; ACC.sub={status:'active',price_id:'review'}; applyPremium(PREMIUM_INLINE); loadDemoPremiumAudio(); render();
  } else if(DEMO){
    const d=store.get('demoAcc',null); if(d&&d.email&&!d.loggedOut){ ACC.user={email:d.email,id:'demo'}; if(d.premium) unlockDemo(d.method==='china'?d.plan:null); }
    render();
  }
}


/* Acentos: convierte vocal+U+0301 en <span class="sv">vocal</span> en todo el texto visible */
const STRESS_RE=/([аеёиоуыэюяАЕЁИОУЫЭЮЯ])\u0301/;
function fixStress(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.indexOf('\u0301')>=0&&!(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA|OPTION|TITLE)$/.test(n.parentNode.nodeName))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){ const parts=n.nodeValue.split(/([аеёиоуыэюяАЕЁИОУЫЭЮЯ]\u0301)/); if(parts.length<2) continue;
    const f=document.createDocumentFragment();
    for(const p of parts){ if(!p) continue; if(STRESS_RE.test(p)&&p.length===2){ const sp=document.createElement('span'); sp.className=p[0]===p[0].toUpperCase()?'sv up':'sv'; sp.textContent=p[0]; f.appendChild(sp);} else f.appendChild(document.createTextNode(p.replace(/\u0301/g,''))); }
    n.parentNode.replaceChild(f,n); }
}
new MutationObserver(ms=>{ for(const m of ms) for(const n of m.addedNodes){ if(n.nodeType===1) fixStress(n); else if(n.nodeType===3&&n.parentNode) fixStress(n.parentNode); } }).observe(document.body,{childList:true,subtree:true,characterData:false});
S.route=routeFromHash(); render(); initAuth();
fixStress(document.body);
